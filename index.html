<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#087f5b">
<title>Shree Ram Dairy - Online</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f7f5;color:#17352c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
header{background:#087f5b;color:#fff;padding:22px 16px;border-radius:0 0 25px 25px}header h1{margin:0;font-size:25px}header p{margin:5px 0 0}.wrap{width:min(560px,100%);margin:auto;padding:15px}
.card{background:#fff;border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 3px 15px #0000000d}
button{border:0;border-radius:14px;padding:14px;font-size:17px;font-weight:700}.primary{background:#087f5b;color:#fff;width:100%}.light{background:#e6f4ef;color:#087f5b}
.row{display:flex;gap:9px}.row>*{flex:1}input{width:100%;padding:13px;border:1px solid #ccd9d4;border-radius:12px;font-size:16px}
.small{font-size:13px;color:#687871}.hidden{display:none}.name{font-size:22px;font-weight:800}.balance{font-size:38px;color:#087f5b;font-weight:800}.money{color:#5e7069}
#reader{margin-top:12px;border-radius:16px;overflow:hidden}#reader video{width:100%!important;border-radius:16px}.qty{background:#e6f4ef;color:#087f5b}
.log{padding:9px 0;border-bottom:1px solid #edf0ee;font-size:14px}.danger{color:#a33;background:#fff0f0}.footer{text-align:center;color:#7b8883;font-size:12px;padding:18px}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>
<header><div class="wrap"><h1>🥛 Shree Ram Dairy</h1><p>Online Prepaid Milk System</p></div></header>
<main class="wrap">

<div id="login" class="card hidden">
<h3>🔐 Staff Login</h3>
<input id="email" type="email" placeholder="Staff email">
<input id="password" type="password" placeholder="Password" style="margin-top:8px">
<button class="primary" style="margin-top:10px" onclick="login()">Login</button>
<p id="loginMsg" class="small"></p>
</div>

<div id="app" class="hidden">
<div class="card">
<div class="small">Login: <span id="userEmail"></span></div>
<button class="light" style="width:100%;margin-top:8px" onclick="logout()">Logout</button>
</div>

<div class="card">
<button class="primary" onclick="startQR()">📷 Customer QR Scan</button>
<div id="reader"></div>
<button id="closeScan" class="light hidden" style="width:100%;margin-top:8px" onclick="stopQR()">Camera बंद करें</button>
</div>

<div class="card">
<div class="small">QR scan न हो तो Customer ID</div>
<div class="row" style="margin-top:8px"><input id="cidInput" placeholder="SRD-001"><button class="primary" style="max-width:115px" onclick="openCustomer()">खोलें</button></div>
</div>

<div id="customer" class="card hidden">
<div class="small">ग्राहक</div><div class="name" id="cname"></div><div class="small" id="cnum"></div>
<div style="margin-top:17px" class="small">बचा हुआ दूध</div><div class="balance"><span id="litres">0</span> L</div>
<div class="money">बची राशि: ₹<span id="money">0</span></div>
<div class="small" style="margin-top:15px">आज कितना दूध दिया?</div>
<div class="row" style="margin-top:8px"><button class="qty" onclick="give(.5)">½ L</button><button class="qty" onclick="give(1)">1 L</button><button class="qty" onclick="give(2)">2 L</button></div>
<button class="light" style="width:100%;margin-top:10px" onclick="recharge()">➕ Advance / Recharge</button>
</div>

<div id="historyCard" class="card hidden"><b>हाल का हिसाब</b><div id="history"></div></div>
</div>
</main>
<div class="footer">Shree Ram Dairy • Hospital Road, Narmada Colony, Gadarwara<br>6265414362</div>

<script>
let auth,db,current=null,scanner=null,configObj={
  apiKey:"AIzaSyDlMKJIMT6CFoXgV0HuovbmWbD1C5xTwQM",
  authDomain:"shree-ram-dairy-3a2b8.firebaseapp.com",
  databaseURL:"https://shree-ram-dairy-3a2b8-default-rtdb.firebaseio.com",
  projectId:"shree-ram-dairy-3a2b8",
  storageBucket:"shree-ram-dairy-3a2b8.firebasestorage.app",
  messagingSenderId:"1090136134112",
  appId:"1:1090136134112:web:96396bb470797f19541b85",
  measurementId:"G-X8GDJ797LY"
};
const RATE=70;
function saveConfig(){
 try{configObj=JSON.parse(document.getElementById("config").value);localStorage.setItem("srd_firebase_config",JSON.stringify(configObj));startFirebase(configObj)}
 catch(e){alert("Firebase config सही JSON में डालें।")}
}
function startFirebase(cfg){
 try{
  if(firebase.apps.length)firebase.app().delete().catch(()=>{});
  firebase.initializeApp(cfg);auth=firebase.auth();db=firebase.database();
  document.getElementById("setup").classList.add("hidden");document.getElementById("login").classList.remove("hidden");
  auth.onAuthStateChanged(u=>{if(u){document.getElementById("login").classList.add("hidden");document.getElementById("app").classList.remove("hidden");document.getElementById("userEmail").textContent=u.email||"Staff"}else{document.getElementById("login").classList.remove("hidden");document.getElementById("app").classList.add("hidden")}});
 }catch(e){alert("Firebase config check करें: "+e.message)}
}
function login(){auth.signInWithEmailAndPassword(email.value,password.value).catch(e=>loginMsg.textContent=e.message)}
function logout(){auth.signOut()}
startFirebase(configObj);
function openCustomer(id){
 id=(id||cidInput.value||"").trim().toUpperCase();if(!id)return;
 current=id;
 db.ref("customers/"+id).on("value",snap=>{
  let c=snap.val();if(!c){alert("Customer नहीं मिला: "+id);return}
  customer.classList.remove("hidden");historyCard.classList.remove("hidden");
  cname.textContent=c.name||id;cnum.textContent=id;
  litres.textContent=Number(c.litres||0).toFixed(1).replace(".0","");
  money.textContent=Math.round(Number(c.litres||0)*RATE);
  let log=c.log||{};let arr=Object.values(log).slice(-20).reverse();
  history.innerHTML=arr.map(x=>`<div class="log">🥛 ${x.qty} L — ₹${x.amount} — ${x.time||""}</div>`).join("")||'<div class="small" style="padding-top:10px">अभी कोई entry नहीं</div>';
 });
}
function give(q){
 if(!current)return;
 const r=db.ref("customers/"+current+"/litres");
 r.transaction(v=>{v=Number(v||0);return v>=q?Math.round((v-q)*10)/10:v})
 .then(res=>{
  if(!res.committed){alert("Balance कम है");return}
  const logRef=db.ref("customers/"+current+"/log").push();
  logRef.set({qty:q,amount:q*RATE,time:new Date().toLocaleString("hi-IN",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}),staff:auth.currentUser?.email||""});
 }).catch(e=>alert(e.message));
}
function recharge(){
 let n=parseFloat(prompt("Advance राशि ₹","2100"));if(!n||n<=0)return;
 db.ref("customers/"+current+"/litres").transaction(v=>Math.round((Number(v||0)+n/RATE)*10)/10);
}
function startQR(){
 if(typeof Html5Qrcode==="undefined"){alert("Internet चालू करें");return}
 document.getElementById("reader").innerHTML="";scanner=new Html5Qrcode("reader");closeScan.classList.remove("hidden");
 scanner.start({facingMode:"environment"},{fps:10,qrbox:{width:230,height:230}},text=>{openCustomer(text);stopQR()},()=>{}).catch(()=>alert("Camera permission Allow करें."));
}
function stopQR(){if(scanner){scanner.stop().catch(()=>{});scanner.clear();scanner=null}reader.innerHTML="";closeScan.classList.add("hidden")}
</script>
</body>
</html>
