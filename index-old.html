<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#087f5b">
<title>Shree Ram Dairy | QR Milk</title>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7f6;color:#17201d;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}header{background:#087f5b;color:#fff;padding:18px 16px}.wrap{max-width:650px;margin:auto;padding:14px}.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 3px 14px #00000012}h1,h2,h3{margin-top:0}input,button{font:inherit}input{width:100%;padding:13px;border:1px solid #ccd6d2;border-radius:11px;margin:6px 0 10px}button{border:0;border-radius:11px;padding:12px 15px;background:#087f5b;color:#fff;font-weight:700;margin:4px 3px 4px 0}button.secondary{background:#e8f3ef;color:#087f5b}button.gray{background:#68736f}.hidden{display:none!important}.muted{color:#65716d;font-size:13px}.msg{padding:10px 12px;border-radius:10px;margin:8px 0;background:#eef6f3}.err{background:#fff0ef;color:#9d1c13}.balance{font-size:34px;font-weight:800;color:#087f5b}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:110px}.customer-box{border:1px solid #dbe4e0;border-radius:12px;padding:12px;margin-top:10px}#reader{width:100%;margin-top:10px}
</style>
</head>
<body>
<header><div class="wrap"><h1>🥛 Shree Ram Dairy</h1><div>QR Prepaid Milk System • Gadarwara</div></div></header>
<main class="wrap">
<div id="loginCard" class="card"><h2>Staff Login</h2><div class="muted">अधिकृत स्टाफ ही लॉगिन करें।</div><input id="email" type="email" placeholder="Staff email"><input id="password" type="password" placeholder="Password"><button id="loginBtn">Login</button><div id="loginMsg"></div></div>
<div id="app" class="hidden">
<div class="card"><div class="muted">Login: <b id="userEmail"></b></div><button id="logoutBtn" class="secondary">Logout</button></div>
<div class="card"><h2>📷 QR से ग्राहक खोलें</h2><button id="scanBtn">QR Scan शुरू करें</button><button id="stopScanBtn" class="gray hidden">Scan बंद करें</button><div id="reader" class="hidden"></div><div id="scanMsg"></div></div>
<div class="card"><h2>ग्राहक खोजें</h2><input id="searchId" placeholder="Customer ID जैसे SRD-001"><button id="openCustomerBtn">ग्राहक खोलें</button><button id="newCustomerBtn" class="secondary">नया ग्राहक</button></div>
<div id="customerCard" class="card hidden"><div class="customer-box"><h2 id="custName">-</h2><div class="muted">Customer ID: <b id="custId">-</b></div><div class="muted">Mobile: <b id="custMobile">-</b></div><hr><div class="muted">बाकी दूध</div><div class="balance"><span id="custLitres">0</span> L</div><div class="muted">Balance value: ₹<span id="custBalance">0</span></div></div><h3>आज दूध दें</h3><div class="row"><button class="milkBtn" data-litre="0.5">0.5 L</button><button class="milkBtn" data-litre="1">1 L</button><button class="milkBtn" data-litre="1.5">1.5 L</button><button class="milkBtn" data-litre="2">2 L</button></div><h3>Recharge</h3><div class="row"><input id="rechargeLitres" type="number" step="0.5" min="0.5" placeholder="Litres"><button id="rechargeBtn">+ Recharge</button></div><h3>Recent History</h3><div id="history"></div></div>
<div id="newCustomerCard" class="card hidden"><h2>नया ग्राहक</h2><input id="newId" placeholder="Customer ID जैसे SRD-001"><input id="newName" placeholder="ग्राहक का नाम"><input id="newMobile" placeholder="मोबाइल नंबर"><input id="newLitres" type="number" step="0.5" min="0" placeholder="Prepaid litres"><button id="createBtn">ग्राहक बनाएं</button><div id="createMsg"></div></div>
<div class="card"><b>Rate: ₹70 / Litre</b><div class="muted">उदाहरण: ₹2,100 prepaid = 30 L</div></div>
</div></main>
<script>
const firebaseConfig={apiKey:"AIzaSyDlMKJIMT6CFoXgV0HuovbmWbD1C5xTwQM",authDomain:"shree-ram-dairy-3a2b8.firebaseapp.com",databaseURL:"https://shree-ram-dairy-3a2b8-default-rtdb.firebaseio.com",projectId:"shree-ram-dairy-3a2b8",storageBucket:"shree-ram-dairy-3a2b8.firebasestorage.app",messagingSenderId:"1090136134112",appId:"1:1090136134112:web:96396bb470797f19541b85",measurementId:"G-X8GDJ797LY"};
const RATE=70; firebase.initializeApp(firebaseConfig); const auth=firebase.auth(); const db=firebase.database(); let currentCustomerId=null,scanner=null;
const $=id=>document.getElementById(id); function msg(id,t,err=false){$(id).innerHTML='<div class="msg '+(err?'err':'')+'">'+t+'</div>'}
auth.onAuthStateChanged(u=>{if(u){$('loginCard').classList.add('hidden');$('app').classList.remove('hidden');$('userEmail').textContent=u.email||''}else{$('loginCard').classList.remove('hidden');$('app').classList.add('hidden')}});
$('loginBtn').onclick=async()=>{try{await auth.signInWithEmailAndPassword($('email').value.trim(),$('password').value);msg('loginMsg','Login सफल ✅')}catch(e){msg('loginMsg',e.message,true)}}; $('logoutBtn').onclick=()=>auth.signOut();
$('newCustomerBtn').onclick=()=>{$('newCustomerCard').classList.toggle('hidden');$('customerCard').classList.add('hidden')}; $('openCustomerBtn').onclick=()=>openCustomer($('searchId').value.trim().toUpperCase());
$('createBtn').onclick=async()=>{const id=$('newId').value.trim().toUpperCase(),name=$('newName').value.trim(),mobile=$('newMobile').value.trim(),litres=Number($('newLitres').value||0);if(!id||!name)return msg('createMsg','Customer ID और नाम भरें।',true);try{const ref=db.ref('customers/'+id),snap=await ref.once('value');if(snap.exists())return msg('createMsg','यह Customer ID पहले से मौजूद है।',true);await ref.set({id,name,mobile,litres,balance:litres*RATE,createdAt:firebase.database.ServerValue.TIMESTAMP,updatedAt:firebase.database.ServerValue.TIMESTAMP});await ref.child('logs').push({type:'create',litresChange:litres,amountChange:litres*RATE,by:auth.currentUser.email,at:firebase.database.ServerValue.TIMESTAMP});msg('createMsg','ग्राहक बन गया ✅');$('searchId').value=id;openCustomer(id)}catch(e){msg('createMsg',e.message,true)}};
async function openCustomer(id){if(!id)return msg('scanMsg','Customer ID डालें।',true);try{const snap=await db.ref('customers/'+id).once('value');if(!snap.exists())return msg('scanMsg','Customer नहीं मिला: '+id,true);currentCustomerId=id;renderCustomer(snap.val());$('newCustomerCard').classList.add('hidden');$('customerCard').classList.remove('hidden');loadHistory(id)}catch(e){msg('scanMsg',e.message,true)}}
function renderCustomer(c){$('custName').textContent=c.name||'-';$('custId').textContent=c.id||currentCustomerId;$('custMobile').textContent=c.mobile||'-';$('custLitres').textContent=Number(c.litres||0).toFixed(1).replace('.0','');$('custBalance').textContent=Math.round(Number(c.balance||0))}
async function loadHistory(id){const snap=await db.ref('customers/'+id+'/logs').limitToLast(20).once('value');let a=[];snap.forEach(x=>a.push(x.val()));a.reverse();$('history').innerHTML=a.map(x=>'<div style="padding:7px 0;border-bottom:1px solid #eee">'+(x.type==='give'?'दूध दिया':'Recharge')+' • '+Number(x.litresChange||0)+' L • ₹'+Math.round(Math.abs(Number(x.amountChange||0)))+'</div>').join('')||'<div class="muted">कोई हिस्ट्री नहीं</div>'}
async function changeMilk(litres){if(!currentCustomerId)return;const ref=db.ref('customers/'+currentCustomerId);try{await db.runTransaction(c=>{if(c===null)return c;const have=Number(c.litres||0);if(have<litres)return; c.litres=+(have-litres).toFixed(2);c.balance=+(c.litres*RATE).toFixed(2);c.updatedAt=firebase.database.ServerValue.TIMESTAMP;return c});const snap=await ref.once('value');if(Number(snap.val().litres||0)<0)return;await ref.child('logs').push({type:'give',litresChange:-litres,amountChange:-litres*RATE,by:auth.currentUser.email,at:firebase.database.ServerValue.TIMESTAMP});renderCustomer(snap.val());loadHistory(currentCustomerId)}catch(e){msg('scanMsg',e.message,true)}}
document.querySelectorAll('.milkBtn').forEach(b=>b.onclick=()=>changeMilk(Number(b.dataset.litre)));
$('rechargeBtn').onclick=async()=>{const litres=Number($('rechargeLitres').value||0);if(!currentCustomerId||litres<=0)return;const ref=db.ref('customers/'+currentCustomerId);try{await ref.transaction(c=>{if(c===null)return c;c.litres=+(Number(c.litres||0)+litres).toFixed(2);c.balance=+(c.litres*RATE).toFixed(2);c.updatedAt=firebase.database.ServerValue.TIMESTAMP;return c});await ref.child('logs').push({type:'recharge',litresChange:litres,amountChange:litres*RATE,by:auth.currentUser.email,at:firebase.database.ServerValue.TIMESTAMP});$('rechargeLitres').value='';const snap=await ref.once('value');renderCustomer(snap.val());loadHistory(currentCustomerId)}catch(e){msg('scanMsg',e.message,true)}};
$('scanBtn').onclick=async()=>{if(!window.Html5Qrcode)return msg('scanMsg','QR scanner load नहीं हुआ। पेज refresh करें।',true);$('reader').classList.remove('hidden');$('stopScanBtn').classList.remove('hidden');$('scanBtn').classList.add('hidden');scanner=new Html5Qrcode('reader');try{await scanner.start({facingMode:'environment'},{fps:10,qrbox:220},decoded=>{stopScan();openCustomer(decoded.trim())},()=>{})}catch(e){msg('scanMsg','Camera permission दें और फिर कोशिश करें।',true)}}; async function stopScan(){if(scanner){try{await scanner.stop()}catch(e){}scanner.clear();scanner=null}$('reader').classList.add('hidden');$('stopScanBtn').classList.add('hidden');$('scanBtn').classList.remove('hidden')}; $('stopScanBtn').onclick=stopScan;
</script></body></html>
